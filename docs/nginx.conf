server {
    listen 80;
    listen 443 ssl;
    server_name 192.0.2.10 ti.example.local;

    # SSL Certificate Configuration
    ssl_certificate     /etc/ssl/certs/www.pem;
    ssl_certificate_key /etc/ssl/private/www.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /feeds/ {
        allow 192.0.2.20;   # Replace with Splunk ES IP
        allow 192.0.2.30;   # Replace with Firewall IP
        allow 127.0.0.1;    # Local testing
        deny all;

        alias /var/www/html/feeds/;
        autoindex on;
        autoindex_exact_size off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        deny all;
    }
}